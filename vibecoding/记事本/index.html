                    focusBlockInput(i);
                    onBlocksChanged();
                    return;
                }
                const del = e.target.closest('.block-delete');
                if (del) {
                    const row = del.closest('.block');
                    const i = parseInt(row.dataset.index, 10);
                    const note = getCurrentNote();
                    if (!note) return;
                    note.content.splice(i, 1);
                    activeBlockIndex = Math.min(activeBlockIndex, Math.max(note.content.length - 1, 0));
                    renderBlocks();
                    if (note.content.length) focusBlockInput(activeBlockIndex);
                    onBlocksChanged();
                    return;
                }
                const cb = e.target.closest('.todo-checkbox');
                if (cb) {
                    const row = cb.closest('.block');
                    const i = parseInt(row.dataset.index, 10);
                    const note = getCurrentNote();
                    if (!note) return;
                    note.content[i].checked = cb.checked;
                    row.classList.toggle('done', cb.checked);
                    onBlocksChanged();
                    return;
                }
                if (e.target.classList.contains('block-empty')) {
                    const note = getCurrentNote();
                    if (!note) return;
                    note.content.push({ type: 'text', text: '' });
                    activeBlockIndex = note.content.length - 1;
                    renderBlocks();
                    focusBlockInput(activeBlockIndex);
                    onBlocksChanged();
                }
            });

            // 工具栏
            document.getElementById('tbHeading').addEventListener('click', () => toolbarAction('heading'));
            document.getElementById('tbTodo').addEventListener('click', () => toolbarAction('todo'));
            document.getElementById('tbDivider').addEventListener('click', () => toolbarAction('divider'));
            document.getElementById('tbBold').addEventListener('click', () => toolbarAction('bold'));
            document.getElementById('tbHighlight').addEventListener('click', () => toolbarAction('highlight'));
        }

        // ============================================================
        //  侧边栏拖拽（修复版）
        // ============================================================
        let isResizing = false;

        function initResize() {
            const handle = document.getElementById('resizeHandle');
            if (!handle) return;

            handle.addEventListener('mousedown', onResizeStart);
            document.addEventListener('mousemove', onResizeMove);
            document.addEventListener('mouseup', onResizeEnd);

            handle.addEventListener('touchstart', onResizeTouchStart, { passive: true });
            document.addEventListener('touchmove', onResizeTouchMove, { passive: false });
            document.addEventListener('touchend', onResizeEnd);
        }

        function onResizeStart(e) {
            isResizing = true;
            document.getElementById('resizeHandle').classList.add('resizing');
            document.body.style.cursor = 'col-resize';
            document.body.style.userSelect = 'none';
            e.preventDefault();
        }

        function onResizeTouchStart() {
            isResizing = true;
            document.getElementById('resizeHandle').classList.add('resizing');
            document.body.style.userSelect = 'none';
        }

        function onResizeMove(e) {
            if (!isResizing) return;
            const sidebar = document.getElementById('sidebar');
            let w = e.clientX;
            w = Math.max(180, Math.min(500, w));
            sidebar.style.width = w + 'px';
            sidebar.style.flex = 'none';
        }

        function onResizeTouchMove(e) {
            if (!isResizing) return;
            e.preventDefault();
            const sidebar = document.getElementById('sidebar');
            let w = e.touches[0].clientX;
            w = Math.max(180, Math.min(500, w));
            sidebar.style.width = w + 'px';
            sidebar.style.flex = 'none';
        }

        function saveSidebarWidth() {
            const w = document.getElementById('sidebar').offsetWidth;
            localStorage.setItem('sticky_notes_sidebar_width', w);
        }

        function onResizeEnd() {
            if (!isResizing) return;
            isResizing = false;
            document.getElementById('resizeHandle').classList.remove('resizing');
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
            saveSidebarWidth();
        }

        function loadSidebarWidth() {
            const saved = localStorage.getItem('sticky_notes_sidebar_width');
            if (saved) {
                const w = parseInt(saved, 10);
                if (w >= 180 && w <= 500) {
                    document.getElementById('sidebar').style.width = w + 'px';
                    document.getElementById('sidebar').style.flex = 'none';
                }
            }
        }

        // ============================================================
        //  键盘快捷键
        // ============================================================
        function handleKeydown(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
                e.preventDefault();
                addNote();
            }
            if (e.key === 'Escape') {
                const cm = document.getElementById('catModal');
                if (cm.classList.contains('show')) {
                    closeCatModal();
                    return;
                }
                const rp = document.getElementById('renamePopup');
                if (rp.classList.contains('show')) {
                    closeRenamePopup();
                    return;
                }
                closeThemePopup();
                if (currentId) { currentId = null; render(); }
            }
        }

        // ============================================================
        //  初始化
        // ============================================================
        function init() {
            document.documentElement.style.setProperty('--accent-color', '#f59e0b');

            loadTheme();
            loadDarkMode();
            loadNotes();
            loadCategories();
            currentId = notes.length ? notes[0].id : null;
            loadSidebarWidth();
            loadRename();
            render();
            renderThemeGrid();
            renderCatTree();
            renderCategorySelect();

            document.getElementById('btnAdd').addEventListener('click', addNote);

            document.getElementById('btnTheme').addEventListener('click', e => {
                e.stopPropagation();
                toggleThemePopup();
            });

            document.getElementById('themeGrid').addEventListener('click', e => {
                const btn = e.target.closest('.theme-option');
                if (btn) setTheme(btn.dataset.theme);
            });

            // 重命名
            document.getElementById('btnRename').addEventListener('click', e => {
                e.stopPropagation();
                openRenamePopup();
            });
            document.getElementById('renameConfirm').addEventListener('click', confirmRename);
            document.getElementById('renameCancel').addEventListener('click', closeRenamePopup);
            // 回车确认
            document.getElementById('renameText').addEventListener('keydown', e => {
                if (e.key === 'Enter') confirmRename();
            });
            document.getElementById('renameEmoji').addEventListener('keydown', e => {
                if (e.key === 'Enter') document.getElementById('renameText').focus();
            });

            document.addEventListener('click', e => {
                const popup = document.getElementById('themePopup');
                const btn = document.getElementById('btnTheme');
                if (popup.classList.contains('show') &&
                    !popup.contains(e.target) && !btn.contains(e.target)) {
                    closeThemePopup();
                }
                // 关闭重命名弹窗
                const rp = document.getElementById('renamePopup');
                const rb = document.getElementById('btnRename');
                if (rp.classList.contains('show') &&
                    !rp.contains(e.target) && !rb.contains(e.target)) {
                    closeRenamePopup();
                }
            });

            document.getElementById('searchInput').addEventListener('input', handleSearch);

            document.getElementById('noteList').addEventListener('click', e => {
                const item = e.target.closest('.note-item');
                const delBtn = e.target.closest('.note-delete');
                if (delBtn) { deleteNote(delBtn.dataset.id, e); return; }
                if (item) selectNote(item.dataset.id);
            });

            document.getElementById('titleInput').addEventListener('input', handleEdit);

            document.addEventListener('keydown', handleKeydown);

            document.getElementById('editorArea').addEventListener('click', e => {
                if (e.target === e.currentTarget) {
                    const note = getCurrentNote();
                    if (!note) return;
                    if (!note.content.length) {
                        note.content.push({ type: 'text', text: '' });
                        activeBlockIndex = note.content.length - 1;
                        renderBlocks();
                        focusBlockInput(activeBlockIndex);
                        onBlocksChanged();
                    } else {
                        setActiveBlock(Math.max(0, note.content.length - 1));
                    }
                }
            });

            // 夜间模式切换
            document.getElementById('darkToggle').addEventListener('change', toggleDarkMode);
            document.getElementById('autoBadge').addEventListener('click', toggleAutoMode);

            initResize();
            initCatEvents();
            initBlockEvents();
            startAutoTimer();

            console.log('📌 便签本已启动！');
            console.log('💡 Ctrl+N 新建 | Esc 返回 | ↔ 拖拽调宽 | 🌙 夜间模式');
        }

        document.addEventListener('DOMContentLoaded', init);

        // ============================================================
        //  PWA Service Worker 注册
        // ============================================================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(reg => {
                    console.log('📦 PWA: Service Worker 已注册', reg.scope);
                }).catch(err => {
                    console.log('📦 PWA: Service Worker 注册失败', err);
                });
            });
        }
    </script>
</body>
</html>
